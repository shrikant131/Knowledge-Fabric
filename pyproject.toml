[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-fabric"
version = "0.9.0"
description = "Local-first agentic RAG and knowledge platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34", "pyyaml>=6.0", "numpy>=1.24", "scikit-learn>=1.3",
  "flask>=3.0", "requests>=2.31", "pypdf>=4.0", "python-docx>=1.1"
]
[project.optional-dependencies]
openai = ["openai>=1.40"]
prod = ["gunicorn>=22.0", "psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0"]
[project.scripts]
kf = "knowledge_fabric.cli:main"
[tool.setuptools.packages.find]
include = ["knowledge_fabric*"]
