{% extends "base.html" %}{% block content %}<div class="card"><h2>Source settings</h2><div class="muted">{{ cfg.display_name or cfg.source_id }}</div><form method="post"><label>LLM</label><select name="llm_enabled"><option value="0" {% if not cfg.effective_llm_enabled() %}selected{% endif %}>OFF — deterministic local mode</option><option value="1" {% if cfg.effective_llm_enabled() %}selected{% endif %}>ON — use selected provider</option></select><label>Provider</label><select name="llm_provider"><option value="local" {% if cfg.llm_provider=='local' %}selected{% endif %}>Local LLM — Ollama</option><option value="bedrock" {% if cfg.llm_provider=='bedrock' %}selected{% endif %}>Amazon Bedrock</option><option value="openai" {% if cfg.llm_provider=='openai' %}selected{% endif %}>OpenAI-compatible</option></select><label>Local model</label><input name="local_llm_model" value="{{ cfg.local_llm_model }}" placeholder="llama3.2:3b"><label>Local endpoint</label><input name="local_llm_base_url" value="{{ cfg.local_llm_base_url }}" placeholder="http://127.0.0.1:11434"><label>Bedrock region</label><input name="bedrock_region" value="{{ cfg.bedrock_region }}"><label>Bedrock model</label><input name="bedrock_chat_model" value="{{ cfg.bedrock_chat_model }}"><label>Top K</label><input name="top_k" type="number" value="{{ cfg.top_k }}" min="1" max="50"><label>Max generation tokens</label><input name="max_tokens" type="number" value="{{ cfg.max_tokens }}" min="100" max="10000"><label><input type="checkbox" name="enable_reranker" value="1" {% if cfg.enable_reranker %}checked{% endif %} style="width:auto"> Enable reranker</label><label><input type="checkbox" name="enable_query_expansion" value="1" {% if cfg.enable_query_expansion %}checked{% endif %} style="width:auto"> Enable query expansion / agent decomposition</label><div style="margin-top:18px"><button>Save</button><a class="button secondary" href="{{ url_for('query_source',source_id=cfg.source_id) }}">Cancel</a></div></form></div>{% endblock %}
