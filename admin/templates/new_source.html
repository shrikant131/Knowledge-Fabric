{% extends "base.html" %}{% block content %}<div class="card"><h2>Register knowledge source</h2><div class="muted">Everything defaults to local/offline mode. You can enable a real LLM after registration.</div><form method="get"><label>Connector type</label><select name="connector_type" onchange="this.form.submit()">{% for t in connector_types %}<option value="{{t}}" {% if t==selected_type %}selected{% endif %}>{{t}}</option>{% endfor %}</select></form><form method="post" action="{{ url_for('create_source') }}"><input type="hidden" name="connector_type" value="{{selected_type}}"><label>Source ID</label><input name="source_id" required placeholder="engineering"><label>Display name</label><input name="display_name" placeholder="Engineering Knowledge"><h3>Connection</h3>{% for key,label,placeholder in fields %}<label>{{label}}</label><input name="{{key}}" placeholder="{{placeholder}}">{% endfor %}<label>Trigger</label><select name="trigger_type"><option value="scheduler">Scheduler</option><option value="webhook">Webhook</option></select><label>Poll interval (seconds)</label><input name="poll_interval_seconds" type="number" value="60"><h3>AI</h3><label>LLM mode</label><select name="llm_enabled"><option value="0">OFF — works immediately without credentials</option><option value="1">ON — use a real provider</option></select><label>Provider</label><select name="llm_provider"><option value="bedrock">Amazon Bedrock</option><option value="openai">OpenAI-compatible</option></select><label>Bedrock region</label><input name="bedrock_region" value="us-east-1"><div style="margin-top:18px"><button>Register</button><a class="button secondary" href="{{url_for('index')}}">Cancel</a></div></form></div>{% endblock %}
