<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Fabric — Sign in</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:30px;width:min(420px,calc(100% - 40px));box-shadow:0 8px 30px #10182814}
h1{margin:0 0 8px}p{color:#667085}label{font-weight:700;display:block;margin:16px 0 7px}input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:#3157d5;color:#fff;font-weight:700}.error{background:#fef3f2;color:#b42318;padding:10px;border-radius:8px}
</style></head><body><div class="card">
<h1>Knowledge Fabric</h1><p>Sign in to the control plane.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token }}">
<input type="hidden" name="next" value="{{ next }}">
<label>Admin API key</label><input type="password" name="api_key" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form></div></body></html>
