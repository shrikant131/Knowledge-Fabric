w:auto}.config-row{display:grid;grid-template-columns:1.5fr repeat(6,1fr);gap:10px;padding:12px;border-bottom:1px solid var(--line);align-items:center;min-width:800px}.config-row:last-child{border:0}.config-row.header{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--soft)}.tool-grid,.connector-grid,.source-cards,.obs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tool-card{display:flex;gap:10px;align-items:flex-start}.tool-card>div{flex:1}.tool-icon{font-size:16px;color:var(--brand)}.connector-card a{display:block;margin-top:12px;color:var(--brand);text-decoration:none;font-weight:700}.source-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.source-top{display:flex;justify-content:space-between;gap:10px}.source-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.source-stats div{background:var(--soft);padding:10px;border-radius:8px}.source-stats span{display:block;color:var(--muted);font-size:11px}.source-stats b{font-size:13px}.error-box{margin-top:12px;padding:10px;background:#fef3f2;color:var(--bad);border-radius:8px;font-size:12px}.empty{padding:28px;border:1px dashed #cfd4dc;border-radius:10px;text-align:center;color:var(--muted);grid-column:1/-1}.empty.small{padding:14px}.failure{padding:10px 0;border-bottom:1px solid var(--line)}.warning{border-color:#fedf89}.lab-controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}.terminal{margin-top:16px;background:#101828;color:#d0d5dd;border-radius:9px;padding:14px;white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;min-height:70px}.benchmark-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.benchmark-grid>div{border:1px solid var(--line);padding:12px;border-radius:8px}.env-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.obs-grid .panel b{display:block;margin-bott </style><script>
document.addEventListener('DOMContentLoaded',function(){
  const token=document.querySelector('meta[name="csrf-token"]')?.content;
  document.querySelectorAll('form[method="post"],form[method="POST"]').forEach(function(f){
    if(!f.querySelector('input[name="_csrf"]')){
      const i=document.createElement('input'); i.type='hidden'; i.name='_csrf'; i.value=token||''; f.appendChild(i);
    }
  });
  const originalFetch=window.fetch;
  window.fetch=function(input,init){
    init=init||{}; const method=(init.method||'GET').toUpperCase();
    if(['POST','PUT','PATCH','DELETE'].includes(method)){
      init.headers=new Headers(init.headers||{}); init.headers.set('X-CSRF-Token',token||'');
    }
    return originalFetch(input,init);
  };
});
</script></head><body><header class="topbar"><h1>Knowledge Fabric</h1><nav><a href="{{ url_for('playground') }}">Playground</a><a href="{{ url_for('quick_start') }}">Quick Start</a><a href="{{ url_for('admin_console') }}">Admin</a>{% if rows is defined and rows %}<a href="{{ url_for('query_source',source_id=rows[0].cfg.source_id) }}">Query</a>{% endif %}</nav></header><div class="wrap">{% block content %}{% endblock %}</div></body></html>
